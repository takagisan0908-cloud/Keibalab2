<style>
:root{
  /* ===== Spotify風 ダーク（既定） ===== */
  --bg:#121212; --bg-top:#242424;
  --card:#181818; --card2:#1f1f1f; --tint:#232323; --tint2:#2a2a2a;
  --ink:#ffffff; --mut:#b3b3b3;
  --line:#2a2a2a; --line2:#3d3d3d;
  --green:#1DB954; --green2:#1ed760; --green3:#153d24;
  --on-accent:#ffffff;      /* 色付き背景の上の文字（マーク・バッジ等） */
  --on-green:#08140c;       /* 緑ボタンの上の文字（Spotifyは黒文字） */
  --ok-ink:#4ade80; --warn-ink:#f2c46b; --err-ink:#ff7b72; --info-ink:#79c0ff; --acc-ink:#d2a8ff;
  --gold:#f2c46b; --goldbg:#2b2415;
  --red:#ff7b72; --blue:#79c0ff; --orange:#ffa657;
  /* 重賞グレードの色（G1=青 / G2=赤 / G3=緑 / Jpn=紫）※2026-09-11にG1とG2を入れ替え */
  --g1:#3b82f6; --g1-bd:#60a5fa; --g2:#e5484d; --g2-bd:#ff6b6f;
  --g3:#22a45d; --g3-bd:#3ecf7a; --gpn:#a855d6; --gpn-bd:#c07ce8;
  --shadow:0 8px 24px rgba(0,0,0,.45);
  --sidebar:#000000; --topbar:rgba(18,18,18,.82); --topbar-ink:#ffffff;
  --hd-btn-bg:rgba(255,255,255,.10); --hd-btn-bd:rgba(255,255,255,.22); --hd-btn-hover:rgba(255,255,255,.20);
  --savest:#a7f3d0;
  --row-alt:#1c1c1c; --row-hover:#262626; --thead:#202020;
  --radius:14px; --radius-sm:10px;
}
html[data-theme="light"]{
  /* ===== 従来のライトテーマ（右上の ☀️ で切替） ===== */
  --bg:#eef3ec; --bg-top:#e4ede2;
  --card:#ffffff; --card2:#f6faf4; --tint:#f1f5ef; --tint2:#e7efe4;
  --ink:#23311f; --mut:#6b7a6c;
  --line:#d6e0d2; --line2:#c3d2c2;
  --green:#0d8f4e; --green2:#16a05c; --green3:#e3f2e6;
  --on-accent:#ffffff; --on-green:#ffffff;
  --ok-ink:#0d6a3c; --warn-ink:#8a5a1a; --err-ink:#b3261e; --info-ink:#0f6fc2; --acc-ink:#6d45b8;
  --gold:#c8860a; --goldbg:#fdf3d7;
  --red:#c93c30; --blue:#0f6fc2; --orange:#e07a1f;
  --g1:#1d4ed8; --g1-bd:#1d4ed8; --g2:#c2332b; --g2-bd:#c2332b;
  --g3:#1d7a4a; --g3-bd:#1d7a4a; --gpn:#7b3fa0; --gpn-bd:#7b3fa0;
  --shadow:0 1px 2px rgba(20,40,24,.06),0 6px 18px rgba(20,40,24,.08);
  --sidebar:#ffffff; --topbar:linear-gradient(135deg,#0a7a40,#12a05c 55%,#0f8f4e); --topbar-ink:#ffffff;
  --hd-btn-bg:rgba(255,255,255,.16); --hd-btn-bd:rgba(255,255,255,.45); --hd-btn-hover:rgba(255,255,255,.30);
  --savest:#d9f5e2;
  --row-alt:#f8fbf7; --row-hover:#f0f7f1; --thead:#e9f3e9;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;color-scheme:light}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
  background:
    radial-gradient(1100px 460px at 82% -8%, rgba(90,180,120,.12) 0%, transparent 60%),
    radial-gradient(900px 500px at -10% 108%, rgba(120,160,200,.10) 0%, transparent 60%),
    var(--bg);
  color:var(--ink); line-height:1.55; font-size:15px;
}
button{font-family:inherit}
h1,h2,h3,h4{margin:0 0 8px}
p{margin:6px 0}
a{color:var(--blue)}
.muted{color:var(--mut)}
.small{font-size:.84rem}
.sp{flex:1}
.mk0{display:inline-block;min-width:1.55em;text-align:center;font-weight:800;border-radius:6px}
.btn{
  border:1px solid var(--line2);background:var(--card);color:var(--ok-ink);
  padding:7px 14px;border-radius:9px;cursor:pointer;font-size:.92rem;
  transition:.15s;white-space:nowrap;font-weight:600;
}
.btn:hover{background:var(--card2);border-color:var(--line2)}
.btn.primary{background:linear-gradient(135deg,#17a763,#0c7c40);color:var(--on-accent);border-color:#0c7c40}
.btn.primary:hover{background:linear-gradient(135deg,#1bb76e,#0e8a47)}
.btn.red{color:var(--red);border-color:var(--line2)}
.btn.red:hover{background:var(--card2)}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--ok-ink);font-weight:500}
.btn.ghost:hover{background:var(--card2)}
.btn.dashed{border-style:dashed;width:100%;color:var(--mut);padding:9px;background:var(--card)}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input,textarea{
  font-family:inherit;font-size:.9rem;color:var(--ink);
  border:1px solid var(--line2);border-radius:8px;padding:5px 8px;background:var(--card);outline:none;
}
select:focus,input:focus,textarea:focus{border-color:var(--green2);box-shadow:0 0 0 2px rgba(22,160,92,.18)}
textarea{resize:vertical}
label{font-size:.85rem;color:var(--mut)}
/* ===== top bar ===== */
header.topbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:linear-gradient(135deg,#0a7a40,#12a05c 55%,#0f8f4e);
  color:var(--on-accent);padding:10px 18px;position:sticky;top:0;z-index:50;
  box-shadow:0 2px 12px rgba(20,80,45,.25);
}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#ffd75e,#e0a400);
  display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15),0 2px 6px rgba(0,0,0,.25)}
.b1{font-size:1.25rem;font-weight:800;letter-spacing:.02em}
.b2{font-size:.72rem;opacity:.9}
.hd{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hd .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.45);color:var(--on-accent)}
.hd .btn:hover{background:rgba(255,255,255,.3)}
.savest{font-size:.72rem;color:var(--on-accent)}
/* ===== tabs (netkeiba風: アクティブタブは白地に緑文字) ===== */
nav.tabs{display:flex;gap:6px;padding:12px 18px 0;max-width:1180px;margin:0 auto}
nav.tabs .tab{
  border:none;background:transparent;padding:9px 16px;border-radius:10px 10px 0 0;
  cursor:pointer;font-weight:700;font-size:.95rem;color:var(--mut);
  border:1px solid transparent;border-bottom:none;
}
nav.tabs .tab:hover{color:var(--ok-ink);background:rgba(255,255,255,.6)}
nav.tabs .tab.active{background:var(--card);color:var(--ok-ink);box-shadow:0 -2px 8px rgba(30,70,40,.10);border-color:var(--line2)}
/* ===== main ===== */
main{max-width:1180px;margin:0 auto;padding:14px 18px 40px}
.page{display:none;animation:fade .25s}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
/* .card を!importantで上書き: 各所のインライン指定も白地に統一 */
.card,.card[style]{
  background:var(--card) !important;
  border:1px solid var(--line2) !important;
  border-radius:14px;
  padding:16px 18px;margin:14px 0;box-shadow:var(--shadow);
}
.card h2{font-size:1.05rem;color:var(--ok-ink);display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:5px;height:1.05em;background:linear-gradient(#f4c94e,#d19c14);border-radius:2px;display:inline-block}
.card h3{font-size:.95rem;color:var(--ok-ink);margin-top:10px}
.row2{display:grid;grid-template-columns:1fr 1.15fr;gap:0 18px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 18px}
/* ★2026-09-13 第23弾②: grid の子は既定で min-width:auto なので、中に white-space:nowrap の要素
   （重みスライダーの自動補正バー .wtbar / 重み自動調整の6列テーブル）があると、
   列が「1fr」より広く押し広げられて ペース診断・重み設定のカードごと横にはみ出していました。
   min-width:0 を与えて「与えられた列幅の中で縮む」ようにします（はみ出さず折り返す）。 */
.row2>*,.row3>*{min-width:0}
.row2 .card,.row3 .card{min-width:0;max-width:100%;overflow-wrap:anywhere}
/* 重み自動調整の6列テーブルは「横スクロールの箱」に入っていますが、
   箱自体に min-width:0 が無いと中身の nowrap 幅でカードを押し広げてしまいます。 */
#wtAutoBox,#wtAutoBox>div{min-width:0;max-width:100%}
#wtAutoBox table{max-width:100%}
@media(max-width:900px){.row2,.row3{grid-template-columns:1fr}}
.cardhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.cardhead h2{margin:0}
.chip{background:var(--card2);color:var(--ok-ink);font-weight:800;padding:3px 10px;border-radius:20px;font-size:.8rem;border:1px solid var(--line2)}
.chip.warn{background:var(--card2);color:var(--err-ink)}
/* ---- 折り込みカード（ページが縦に伸びないようにする） ---- */
details.card.fold{background:var(--card) !important;border:1px solid var(--line2) !important;border-radius:14px;
  padding:10px 14px;margin:14px 0;box-shadow:var(--shadow)}
details.card.fold>summary.foldhead{list-style:none;cursor:pointer;display:flex;align-items:center;
  gap:10px;flex-wrap:wrap;margin:0;padding:2px 0;font-size:1rem;color:var(--ok-ink);font-weight:700}
details.card.fold>summary.foldhead::-webkit-details-marker{display:none}
details.card.fold>summary.foldhead::marker{content:""}
details.card.fold>summary.foldhead .fmark{color:var(--ok-ink);font-size:.8rem;width:.9em;flex:none}
details.card.fold>summary.foldhead .fmark::before{content:"▶"}
details.card.fold[open]>summary.foldhead .fmark::before{content:"▼"}
details.card.fold>summary.foldhead h2{margin:0}
details.card.fold>summary.foldhead .foldhint{font-size:.72rem;color:var(--mut);font-weight:500}
details.card.fold[open]>summary.foldhead .foldhint::before{content:"クリックで折りたたむ"}
details.card.fold:not([open])>summary.foldhead .foldhint::before{content:"クリックで開く"}
details.card.fold>.foldbody{margin-top:8px}
/* 折り込んだままでも中身の要点が読めるようにする「要約行」（summary内の2行目） */
details.card.fold>summary.foldhead .foldpick{flex:1 0 100%;font-weight:600;font-size:.82rem;
  color:var(--ink);background:var(--card2);border:1px solid var(--line2);border-radius:10px;
  padding:6px 10px;line-height:1.7;cursor:pointer;margin-top:2px}
details.card.fold>summary.foldhead .foldpick b{color:var(--ok-ink)}
details.card.fold>summary.foldhead .foldpick .pickwarn{color:var(--warn-ink);font-weight:700}
.hbsbox{max-height:58vh;overflow:auto;border:1px solid var(--line);border-radius:11px;
  padding:2px 8px;background:var(--card);-webkit-overflow-scrolling:touch}
.hbsbox .hbhorse:first-child{margin-top:4px}
@media(max-width:640px){.hbsbox{max-height:52vh}}
.hr{border:none;border-top:1px dashed var(--line);margin:14px 0}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);margin-top:10px}
summary{cursor:pointer;font-weight:600;font-size:.86rem;color:var(--ok-ink)}
details ol,.note{padding-left:1.2em;font-size:.82rem;color:var(--mut);margin:6px 0}
.empty{border:2px dashed var(--line2);color:var(--mut);text-align:center;padding:34px;background:var(--card)!important}
.empty .big{font-size:1.1rem;font-weight:700;color:var(--ok-ink)}
.empty .btn{margin-top:10px}
/* ===== forms ===== */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.fcell{display:flex;flex-direction:column;gap:3px}
.fcell input,.fcell select{padding:6px 8px}
.fcell.full{grid-column:1/-1}
/* progress */
.prog{margin-top:10px}
.progbar{height:9px;border-radius:6px;background:var(--tint);overflow:hidden}
.progbar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#2fbf77,#149755);transition:width .3s}
.prog span{font-size:.78rem;color:var(--mut)}
/* table */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
thead th{position:sticky;top:0;background:var(--card2);color:var(--ok-ink);font-size:.78rem;font-weight:700;border-bottom:2px solid var(--line2);z-index:2}
tbody tr:nth-child(even){background:var(--card)}
tbody tr:hover{background:var(--card2)}
td input{width:100%;min-width:56px;padding:4px 5px;border-radius:6px;background:var(--card)}
td input.nm{min-width:118px}
td input.sm{min-width:46px}
.fc{width:1.05em;height:1.05em;border-radius:50%;display:inline-block;vertical-align:middle;border:1px solid rgba(0,0,0,.3)}
.rowdel{color:var(--err-ink);border:none;background:none;cursor:pointer;font-size:1.05rem}
.rowdel:hover{color:var(--red)}
.badge{display:inline-block;background:#2aa56b;color:var(--on-accent);border-radius:6px;padding:0 5px;font-weight:800;font-size:.78rem}
/* pace */
.pacebig{font-size:clamp(1.15rem,4.6vw,1.9rem);font-weight:900;color:var(--ok-ink);text-align:center;letter-spacing:.03em;padding:4px 0 2px;overflow-wrap:anywhere;line-height:1.25}
.pacesub{text-align:center;font-size:.8rem;color:var(--mut)}
.pacebar{height:16px;border-radius:9px;background:linear-gradient(90deg,#4a9ae0,#37b56c 45%,#e5ab2f 78%,#e0523f);margin:10px 0 4px;position:relative;overflow:hidden}
.pacebar i{position:absolute;top:-4px;width:4px;height:24px;background:var(--card);border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.4)}
.pacescale{display:flex;justify-content:space-between;font-size:.72rem;color:var(--mut)}
.scenario{background:var(--card2);border:1px solid var(--line2);border-left:5px solid var(--green2);border-radius:9px;padding:9px 12px;font-size:.88rem;margin-top:10px}
.slist{font-size:.84rem}
.slist b{color:var(--ok-ink)}
/* sliders */
.slider{display:flex;align-items:center;gap:10px;margin:7px 0;flex-wrap:wrap;min-width:0}
.slider label{flex:0 1 130px;min-width:0;font-size:.82rem;font-weight:600;color:var(--mut);overflow-wrap:anywhere}
.slider input[type=range]{flex:1 1 120px;min-width:90px;accent-color:#16a05c}
.slider output{flex:0 0 46px;text-align:right;font-weight:800;color:var(--ok-ink);font-size:.85rem}
/* ★2026-09-13 第21弾⑤: 重みスライダーの右に出す「レースごとの自動補正 → 実効値」 */
/* ★2026-09-13 第23弾②: min-width:118px + nowrap が列を押し広げて横はみ出しの原因になっていたため、
